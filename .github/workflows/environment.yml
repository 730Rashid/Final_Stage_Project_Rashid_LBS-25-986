name: my-research-env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cpuonly
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - pillow>=10.0.0
  - umap-learn>=0.5.3
  - hdbscan>=0.8.33
  - pytest>=7.4.0
  - flake8>=6.0.0
  - pip:
    - transformers>=4.36.0
    - plotly>=5.15.0
    - dash>=2.11.0
    - dash-bootstrap-components>=1.4.0
    - flask>=2.3.0
    - tqdm>=4.65.0
    - h5py>=3.9.0
    - opencv-python-headless>=4.8.0
    - ripser>=0.6.0
    - pot>=0.9.0
    - networkx>=3.0
